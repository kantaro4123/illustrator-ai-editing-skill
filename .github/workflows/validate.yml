name: validate

on:
  # Pull-request branches are covered by the pull_request trigger; limiting push
  # to main keeps a branch push from running the same job twice.
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
